    <text x="499" y="357" fill="#A9B1B2" font-family="Figtree, Inter, Arial, sans-serif" font-size="30" font-weight="500">Move context between AI assistants</text>

    <text x="325" y="466" fill="#D8E1E1" font-family="Figtree, Inter, Arial, sans-serif" font-size="27" font-weight="500">

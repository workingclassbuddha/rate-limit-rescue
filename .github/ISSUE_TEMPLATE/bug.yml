name: Bug report
description: Report an extension, capture, import or handoff problem.
title: "[Bug]: "
body:
  - type: input
    id: environment
    attributes:
      label: Extension version, browser version and operating system
    validations:
      required: true
  - type: input
    id: providers
    attributes:
      label: Source and destination assistant (if applicable)
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use a synthetic conversation or non-sensitive sample.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted errors or screenshots
      description: Do not attach real chat transcripts, API keys, session cookies or private context packs.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed sensitive conversation content and credentials.
          required: true
